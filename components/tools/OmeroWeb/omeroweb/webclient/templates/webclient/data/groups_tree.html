<ul>
{% for group in manager.groups %}
    {% if group.show_group %}
    <li id="group-{{ group.id }}" rel="group_{{ group.details.permissions }}" {% if group.experimenter_counter %}class="jstree-closed"{% endif %}>
        <a href="#">
            <span class="node_name">{{ group.name }}</span>
            {% if group.experimenter_counter %}
                <span class="children_count">{{ group.experimenter_counter }}</span>
            {% endif %}
        </a>
    </li>
    {% endif %}
{% endfor %}
</ul>
