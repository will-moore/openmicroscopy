<ul>
{% for group in groups %}
    {% if group.show %}
    <li id="group-{{ group.id }}" rel="group_{{ group.perms }}" {% if group.exp_count %}class="jstree-closed"{% endif %}>
        <a href="#">
            <span class="node_name">{{ group.name }}</span>
            {% if group.exp_count %}
                <span class="children_count">{{ group.exp_count }}</span>
            {% endif %}
        </a>
    </li>
    {% endif %}
{% endfor %}
</ul>
